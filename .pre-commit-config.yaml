repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
        args: [--config, ruff.toml]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: architectural-guardrails
        name: Architectural Boundary Guardrails
        entry: ./venv/bin/pytest -q test_guardrails.py
        language: system
        pass_filenames: false
        always_run: true
